name: Build DSK Intro Player

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Wiederherstellen
        run: dotnet restore DskIntroPlayer.csproj

      - name: Bauen
        run: dotnet build DskIntroPlayer.csproj -c Release -o build_output

      - name: DLL hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DskIntroPlayer
          path: build_output/DskIntroPlayer.dll
